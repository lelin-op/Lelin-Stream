name: Goreleaser

on:
  workflow_dispatch:
    inputs:
      goReleaserArgs:
        description: "Args goreleaser"
        required: false
        default: "--clean"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - run: git fetch --force --tags
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25
          
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release ${{ github.event.inputs.goReleaserArgs }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          
      # --- NEW STEPS FOR RAILWAY INTEGRATION ---
      
      - name: Install Railway CLI
        run: npm i -g @railway/cli
        
      - name: Sync Secrets to Railway and Deploy
        run: |
          # This pushes ALL your GitHub secrets to Railway variables
          railway variables --set \
            API_HASH="${{ secrets.API_HASH }}" \
            API_ID="${{ secrets.API_ID }}" \
            BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
            LOG_CHANNEL="${{ secrets.LOG_CHANNEL }}" \
            MULTI_TOKEN1="${{ secrets.MULTI_TOKEN1 }}" \
            MULTI_TOKEN2="${{ secrets.MULTI_TOKEN2 }}" \
            MULTI_TOKEN3="${{ secrets.MULTI_TOKEN3 }}" \
            MULTI_TOKEN4="${{ secrets.MULTI_TOKEN4 }}"
          
          # This triggers the deployment on Railway
          railway up -d
        env:
          # Railway needs a token to authenticate this action
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Railway needs the project ID to know where to put the variables
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          
